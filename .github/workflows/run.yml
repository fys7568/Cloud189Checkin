name: Cloud check in action
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 35 5 * * *

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: user
    permissions:
      contents: write
    steps:
      - name: 🔀 random delay 0-300 seconds
        run: sleep $((RANDOM % 301))
      - name: 🔌 Check out code
        uses: actions/checkout@v4
      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: 📹 Restore cached Cookie
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: cloud189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: cloud189-token-
      - name: 🔧 Write .env from explicit secrets
        env:
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
          TY_USERNAME_1: ${{ secrets.TY_USERNAME_1 }}
          TY_PASSWORD_1: ${{ secrets.TY_PASSWORD_1 }}
          SENDKEY: ${{ secrets.SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          WECOM_BOT_TELPHONE: ${{ secrets.WECOM_BOT_TELPHONE }}
          WX_PUSHER_APP_TOKEN: ${{ secrets.WX_PUSHER_APP_TOKEN }}
          WX_PUSHER_UID: ${{ secrets.WX_PUSHER_UID }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          SHOWDOC_KEY: ${{ secrets.SHOWDOC_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          WPUSH_APIKEY: ${{ secrets.WPUSH_APIKEY }}
          WPUSH_CHANNEL: ${{ secrets.WPUSH_CHANNEL }}
          WPUSH_TOPIC_CODE: ${{ secrets.WPUSH_TOPIC_CODE }}
        run: |
          : > .env
          for k in TY_ACCOUNTS TY_USERNAME_1 TY_PASSWORD_1 SENDKEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID \
                   WECOM_BOT_KEY WECOM_BOT_TELPHONE WX_PUSHER_APP_TOKEN WX_PUSHER_UID \
                   PUSH_PLUS_TOKEN SHOWDOC_KEY BARK_KEY BARK_SERVER WPUSH_APIKEY WPUSH_CHANNEL WPUSH_TOPIC_CODE; do
            v="${!k}"
            if [ -n "$v" ]; then printf "%s='%s'\n" "$k" "$v" >> .env; fi
          done
      - name: 📡 Init dependencies
        run: npm install
      - name: 🚀 Run
        run: npm start
      - name: 🔑 Compute token hash
        if: always()
        run: |
          NEW_HASH=$(find .token -name '*.json' -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "TOKEN_HASH=${NEW_HASH}" >> $GITHUB_ENV
      - name: 📹 Save cached Cookie
        if: always() && env.TOKEN_HASH != ''
        uses: actions/cache/save@v4
        with:
          path: .token
          key: cloud189-token-${{ env.TOKEN_HASH }}
      - name: 🚗 Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push

      - name: 🎉 Delete old workflow run
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
